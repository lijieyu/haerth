server {
    listen 80 default_server;
    listen 172.26.29.139:80 default_server;
    server_name _;

    return 444;
}

server {
    listen 172.26.29.139:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/haerth.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/haerth.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 421;
}

server {
    listen 172.26.29.139:80;
    server_name haerth.cn www.haerth.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/haerth-web;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 172.26.29.139:443 ssl;
    server_name haerth.cn www.haerth.cn;

    root /var/www/haerth-web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /iris/ {
        proxy_pass http://127.0.0.1:18789/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    ssl_certificate /etc/letsencrypt/live/haerth.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/haerth.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
